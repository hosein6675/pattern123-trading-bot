name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**', 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest pytest-cov ruff pyyaml

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run smoke test
        env:
          PYTHONPATH: .
        run: python test_engine.py

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --cov=modules --cov=backtest --cov-report=term-missing --cov-report=xml

      - name: Lint changed engineering surface
        run: |
          python -m ruff check backtest modules/market_intelligence tests --select E,F

      - name: Validate workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text())
          print('workflow yaml: ok')
          PY
